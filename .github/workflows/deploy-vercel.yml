# Deploy the built site to Vercel.
#
# This is the ONLY path to production. Vercel's own git deployments are turned
# off in frontend/vercel.json, so nothing publishes except this workflow.
#
# That is a choice, not a limitation. Vercel can build this site: prerendering
# needs Chromium, and its build image lacks both the browser and the libraries
# it links against, but installing the Amazon Linux equivalents works —
#
#   dnf install -y nss nspr atk at-spi2-atk cups-libs libdrm libXcomposite \
#     libXdamage libXext libXfixes libXrandr mesa-libgbm alsa-lib pango \
#     libxkbcommon
#
# — and a git-sourced deployment did reach READY that way. It was disabled
# because having both paths live meant two production deployments racing for
# the same alias on every push, with the winner decided by whichever build
# happened to finish last.
#
# Building here rather than there also means the deployed artifact is the same
# one CI already verified on the pull request, produced by the same `yarn build`
# a contributor runs — not a second build in a different image that happens to
# agree. And it does not depend on those package names continuing to exist.
#
# The gate is verify-prerender, below: a build that produced empty or duplicate
# pages is abandoned before anything reaches Vercel.
#
# GitHub Pages still deploys from deploy-pages.yml and remains a working
# fallback. See docs/website-v2/VERCEL_MIGRATION_PLAN.md.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy prebuilt output
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # The secrets may not exist yet. Skipping is correct rather than failing:
      # until the owner adds them, Pages is still the only host and a red X on
      # every commit would be noise about a migration that has not started.
      - name: Check for Vercel credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not configured — skipping. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to enable."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        if: steps.creds.outputs.present == 'true'
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install Chromium for prerendering
        if: steps.creds.outputs.present == 'true'
        working-directory: frontend
        run: npx --yes playwright install --with-deps chromium

      - name: Build (parity check, image provenance, sitemap, prerender)
        if: steps.creds.outputs.present == 'true'
        working-directory: frontend
        run: CI=true yarn build

      # The gate. A deployment that produced empty or duplicate pages is
      # abandoned here, before anything reaches Vercel.
      - name: Verify prerendered output
        if: steps.creds.outputs.present == 'true'
        working-directory: frontend
        run: node scripts/verify-prerender.js

      # `vercel build` would rebuild from source and hit the same Playwright
      # wall, so the already-built output is staged as a static Build Output API
      # v3 directory instead: plain files served as-is, with config.json
      # carrying the routing and header rules from vercel.json.
      #
      # Staged at the REPOSITORY ROOT, not under frontend/. The CLI looks for
      # .vercel/output relative to its own working directory and does not apply
      # the project's root directory when doing so — staging it under frontend/
      # produced "no prebuilt output found in .vercel/output".
      - name: Stage build output for Vercel
        if: steps.creds.outputs.present == 'true'
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -r frontend/build/. .vercel/output/static/
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("frontend/vercel.json", "utf8"));
            fs.writeFileSync(".vercel/output/config.json", JSON.stringify({
              version: 3,
              cleanUrls: v.cleanUrls,
              trailingSlash: v.trailingSlash,
              headers: v.headers,
            }, null, 2));
          '
          echo "Staged $(find .vercel/output/static -type f | wc -l) files."

      # Run from the repository root, NOT from frontend/. The project's root
      # directory is already "frontend", and the CLI appends that when locating
      # the project — running here in frontend/ made it look for
      # frontend/frontend. It does NOT apply that root directory when locating
      # .vercel/output, which is why the staging step above writes to the
      # repository root. Both errors were hit in that order getting here.
      - name: Deploy to Vercel
        if: steps.creds.outputs.present == 'true'
        run: |
          npx --yes vercel@latest deploy --prebuilt --prod \
            --token "$VERCEL_TOKEN" --yes
