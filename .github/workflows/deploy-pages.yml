name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Keyed on the lockfile hash. cache-dependency-path is explicit
          # because the only package.json lives in frontend/, and a stray
          # lockfile at the repo root would otherwise make the key ambiguous.
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # --frozen-lockfile pins the install to the committed tree and fails the
      # build if yarn.lock and package.json have drifted, instead of resolving
      # a fresh tree on every run. Without it a transitive dependency could
      # break a deploy with no change on our side, and the bundle currently
      # live could not be reproduced.
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # The postbuild prerender step drives a real browser to render each route
      # to static HTML. Without this the deploy would ship the empty app shell.
      - name: Install Chromium for prerendering
        working-directory: frontend
        run: npx --yes playwright install --with-deps chromium

      - name: Build (includes sitemap + prerender)
        working-directory: frontend
        run: CI=true yarn build

      # Fail the deploy rather than publish an unindexable shell if prerendering
      # silently produced empty pages.
      - name: Verify prerendered output
        working-directory: frontend
        run: node scripts/verify-prerender.js

      # Same marker EDITH writes, so "which website is live?" is always
      # answerable from the deployed site itself rather than inferred from
      # workflow history. See .github/workflows/edith.yml.
      - name: Write deployment marker
        run: |
          cat > frontend/build/edith.json <<JSON
          {
            "channel": "live",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployedBy": "${{ github.actor }}",
            "runId": "${{ github.run_id }}",
            "reason": "",
            "via": "deploy-pages"
          }
          JSON

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
