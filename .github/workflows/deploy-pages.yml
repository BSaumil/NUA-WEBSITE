name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No yarn.lock is committed yet, so this resolves fresh each run rather
      # than using --frozen-lockfile or actions/setup-node's lockfile-hash
      # cache. Commit a yarn.lock and switch this to --frozen-lockfile (with
      # cache: yarn / cache-dependency-path restored above) once one exists.
      - name: Install dependencies
        working-directory: frontend
        run: yarn install

      # The postbuild prerender step drives a real browser to render each route
      # to static HTML. Without this the deploy would ship the empty app shell.
      - name: Install Chromium for prerendering
        working-directory: frontend
        run: npx --yes playwright install --with-deps chromium

      - name: Build (includes sitemap + prerender)
        working-directory: frontend
        run: CI=true yarn build

      # Fail the deploy rather than publish an unindexable shell if prerendering
      # silently produced empty pages.
      - name: Verify prerendered output
        working-directory: frontend
        run: node scripts/verify-prerender.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
