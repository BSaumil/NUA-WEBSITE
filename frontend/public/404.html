<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NUA: Restaurant OS</title>
    <!--
      GitHub Pages serves this for any unknown path (i.e. every client-side
      route). It re-encodes the real path into the query string and redirects
      to index.html, which decodes it back via the script in public/index.html.
      pathSegmentsToKeep = 0 because the site is served at the domain root
      (nuapos.com.au/CNAME), not under a /repo-name/ subpath.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
